name: Publish STEEZ8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yml', 'source-revision.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      # The GitHub Pages custom domain is a repository setting, not the
      # CNAME inside the Actions artifact. Attempt the REST API switch first,
      # then refuse to publish until GitHub confirms the new setting.
      - name: Assign steez8.me as the GitHub Pages custom domain
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""')
          if [[ "$current" != "steez8.me" ]]; then
            echo "GitHub Pages currently targets '${current}'. Requesting steez8.me."
            if ! gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f cname="steez8.me"; then
              echo "::error::The Actions token could not change the Pages custom domain. Assign steez8.me in repository Settings > Pages (requires Pages/Administration write permission)."
              exit 1
            fi
          fi
          confirmed=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""')
          if [[ "$confirmed" != "steez8.me" ]]; then
            echo "::error::GitHub Pages is still assigned to '${confirmed}', not steez8.me."
            exit 1
          fi
          echo "GitHub Pages custom domain confirmed: ${confirmed}"
      - name: Pin STEEZ8 source to the release marker
        id: release
        shell: bash
        run: |
          set -euo pipefail
          SHA=$(awk '$1 == "Commit:" { print $2 }' source-revision.txt)
          if [[ ! "$SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo '::error::source-revision.txt must contain a 40-digit lowercase SHA'
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Publishing STEEZ8 source: $SHA"
      - uses: actions/checkout@v4
        with:
          repository: BillyHinze/steez8
          ref: ${{ steps.release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          DATABASE_DRIVER: libsql
      - run: pnpm run build:pages
        env:
          BACKEND_ORIGIN: https://api.steez8.me
          BACKEND_FALLBACK_ORIGINS: https://steez8-api.onrender.com
          PUBLIC_SITE_ORIGIN: https://steez8.me
      - name: Confirm canonical domain is restored in build
        run: |
          test "$(cat dist/CNAME)" = "steez8.me"
          grep -q 'https://steez8.me' dist/index.html
          if grep -q 'https://novacryptotool.com' dist/index.html; then
            echo "::error::Temporary hostname still present as canonical URL"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  verify:
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BillyHinze/steez8
          ref: ${{ needs.build.outputs.source_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check public DNS, HTTPS, essential assets, backend and WebSockets
        run: node scripts/check-public-site.mjs
        env:
          PUBLIC_SITE_ORIGIN: https://steez8.me
