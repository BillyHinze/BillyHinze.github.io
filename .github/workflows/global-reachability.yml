name: Check STEEZ8 worldwide reachability

on:
  push:
    branches: [main]
    paths: ['.github/workflows/global-reachability.yml']
  schedule:
    # Four modest global measurements per day. This is diagnostics, not a keep-alive.
    - cron: '43 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steez8-global-reachability
  cancel-in-progress: true

jobs:
  global-network:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: BillyHinze/steez8
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Inspect authoritative DNS instead of only cached recursive answers
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dig >/dev/null 2>&1; then
            echo "::warning::dig is unavailable on the runner; skipping authoritative DNS check"
            exit 0
          fi
          for ns in $(dig +short steez8.me NS); do
            echo "### Authoritative DNS: ${ns}"
            dig +time=3 +tries=1 @"${ns}" steez8.me AAAA +noall +answer || true
            dig +time=3 +tries=1 @"${ns}" www.steez8.me CNAME +noall +answer || true
          done
      - name: Diagnose www HTTPS certificate and redirect
        shell: bash
        run: |
          # This is a read-only diagnostic for the site's public certificate.
          # DNS is already correct; a curl SSL error distinguishes issuance
          # delays from a redirect/configuration failure.
          if curl -fsSI --max-time 15 --connect-timeout 7 https://www.steez8.me/; then
            echo "www HTTPS endpoint responded successfully"
          else
            echo "::warning::www HTTPS is not yet responding with a valid TLS certificate and successful status"
          fi
      - name: Test IPv4, IPv6, www redirect and multiplayer across six continents
        run: node scripts/audit-global-reachability.mjs
