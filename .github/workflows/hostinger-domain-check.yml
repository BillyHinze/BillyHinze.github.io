name: Check Hostinger domain before cutover

on:
  push:
    branches: [migration/novacryptotool-com-cutover]
    paths: ['.github/workflows/hostinger-domain-check.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dns-and-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify Hostinger DNS and Render new-origin readiness
        shell: bash
        run: |
          set -uo pipefail
          domain=novacryptotool.com
          echo "===== PUBLIC DNS ====="
          echo "Authoritative nameservers:"
          dig +short NS "$domain" | sort
          nslist=$(dig +short NS "$domain")
          if [ -z "$nslist" ]; then echo "::warning::No authoritative NS found"; fi
          for ns in $nslist; do
            echo "----- DNS from authoritative $ns -----"
            for type in A AAAA CAA; do
              dig +time=4 +tries=1 @"$ns" "$domain" "$type" +noall +answer || true
            done
            dig +time=4 +tries=1 @"$ns" "www.$domain" CNAME +noall +answer || true
          done
          echo "===== RECURSIVE DNS ====="
          for type in A AAAA CAA; do
            dig +short "$domain" "$type" || true
          done
          dig +short "www.$domain" CNAME || true
          echo "===== TLS AND HTTPS ====="
          for host in "$domain" "www.$domain"; do
            echo "-- https://$host/ --"
            curl -sSI --max-time 12 "https://$host/" | head -n 15 ||
              echo "::warning::$host HTTPS is not ready (expected before GitHub Pages domain cutover)"
            echo "-- raw TLS diagnostics for $host --"
            curl -Is --max-time 12 -o /dev/null -w 'HTTP %{http_code}, SSL verify=%{ssl_verify_result}, resolved IP=%{remote_ip}\n' "https://$host/" ||
              echo "::warning::$host certificate or network still needs work"
          done
          echo "===== APEX CONTENT (NO LOGIN OR PLAYER DATA) ====="
          content=$(curl -fsSL --max-time 15 "https://$domain/" || true)
          if printf '%s' "$content" | grep -qi 'STEEZ8'; then
            echo "Apex response includes STEEZ8 branding"
          else
            echo "::warning::Apex responds over HTTPS but does not serve STEEZ8 branding"
          fi
          printf '%s' "$content" | grep -Eoi '<title>[^<]{0,150}' | head -n 2 || true
          echo "===== CERTIFICATE NAMES ====="
          for host in "$domain" "www.$domain"; do
            echo "-- certificate for $host --"
            echo | openssl s_client -connect "$host:443" -servername "$host" 2>/dev/null |
              openssl x509 -noout -subject -ext subjectAltName 2>/dev/null | head -n 10 || true
          done
          echo "===== RENDER CORS ====="
          for origin in "https://novacryptotool.com" "https://www.novacryptotool.com" "https://steez8.me"; do
            echo "Origin: $origin"
            curl -sS -D - -o /dev/null --max-time 20 -H "Origin: $origin" "https://steez8-api.onrender.com/api/health" | grep -iE '^(HTTP/|access-control-allow-origin:|vary:|content-type:)' || true
          done
          echo "Diagnostic complete. A nonzero TLS or absent CORS header is not treated as proof the main game is offline."
